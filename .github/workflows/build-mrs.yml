name: Build MRS

# Automatically rebuild MRS whenever a custom rule list changes.

on:
  push:
    branches:
      - main
    paths:
      - "rules/*.list"
      - ".github/workflows/build-mrs.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  MIHOMO_VERSION: "v1.19.33"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mihomo
        shell: bash
        run: |
          set -euo pipefail

          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"

          curl -fL --retry 3 "$url" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Build MRS
        shell: bash
        run: |
          set -euo pipefail

          rm -rf output
          mkdir -p output

          shopt -s nullglob

          files=(rules/*.list)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No rule files found. Nothing to build."
            exit 0
          fi

          built=0

          for file in "${files[@]}"; do
            name="$(basename "$file" .list)"
            tmp="rules/.${name}.build.list"

            # Ignore blank lines and full-line comments.
            grep -vE '^[[:space:]]*(#|$)' "$file" > "$tmp" || true

            if [ ! -s "$tmp" ]; then
              echo "Skipping $file: no active rules."
              rm -f "$tmp"
              continue
            fi

            echo "Building $name.mrs ..."

            ./mihomo convert-ruleset \
              domain \
              text \
              "$tmp" \
              "output/$name.mrs"

            rm -f "$tmp"
            built=$((built + 1))
          done

          if [ "$built" -eq 0 ]; then
            echo "No non-empty rule lists. Nothing to publish."
            exit 0
          fi

          ls -lh output/

      - name: Publish MRS to release branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated files outside the Git worktree.
          rm -rf /tmp/mrs-output
          mkdir -p /tmp/mrs-output
          cp output/*.mrs /tmp/mrs-output/

          # Rebuild the release branch from scratch.
          git fetch origin release:release || true
          git checkout --orphan release

          git rm -rf . || true

          cp /tmp/mrs-output/*.mrs .

          git add '*.mrs'
          git commit -m "build: update MRS"
          git push origin release --force
